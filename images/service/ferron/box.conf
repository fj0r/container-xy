*:8080 {
  root "/srv"
  # SSE: ferron3 引擎层对 CGI 响应做整体缓冲 (native_sockets.rs zerocopy 路径),
  # 模块配置无解; dynamic_compressed false 排除压缩缓冲仍不够
  dynamic_compressed false
  cgi {
  }
  # 专有入口优先: bin / vessel
  rewrite "^/bin/(.*)" "/ferron/bin.nu/bin/$1" {
    file true
    directory true
    last true
  }
  rewrite "^/vessel/(.*)" "/ferron/vessel.nu/vessel/$1" {
    file true
    directory true
    last true
  }
  # 根兜底 → box 主服务 (box.d/<rel>, 无前缀; PREFIX_LEN=1 跳过脚本段后 rel 即完整路径)
  rewrite "^/(.*)" "/ferron/box.nu/box/$1" {
    file true
    directory true
    last true
  }
  cgi {
    extension ".nu"
    environment "PREFIX_LEN" "1"
    environment "DATA_ROOT" "/srv/data"
    environment "HOOKS_ROOT" "/srv/hooks"
    environment "META_ROOT" "/srv/meta"
  }
  observability {
    provider "file"
    access_log "/dev/stdout"
  }
  observability {
    provider "file"
    error_log "/dev/stderr"
  }
}
