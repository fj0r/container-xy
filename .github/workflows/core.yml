name: core

on:
  push:
    branches: [release, core]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  USERNAME: orbsh
  IMAGE_NAME: xy

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !endsWith(github.event.head_commit.message, '~') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: "true"

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: orbsh
          password: ${{ secrets.GHCR_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.0'

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            test:
              - 'images/test.nu'
            base:
              - 'images/core/base.nu'
            rust:
              - 'images/core/rust.nu'

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: contains(github.event.head_commit.message, '+test')
        with:
          ## Use the deployed Upterm server via Websocket or SSH
          upterm-server: ${{ secrets.UPTERMD_ADDR }}

      - name: test
        # if: steps.changes.outputs.base == 'true'
        if: contains(github.event.head_commit.message, '+test')
        shell: buildah unshare nu {0}
        run: |
          overlay use ${{ github.workspace }}/images/test.nu as build
          build {
            from: 'ghcr.io/orbsh/xy:z'
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: test
          }

      - name: build ubuntu
        shell: buildah unshare nu {0}
        run: |-
          overlay use ${{ github.workspace }}/images/core/deb.nu as build
          build {
            from: 'ubuntu'
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: ubuntu
          }

      - name: build debian
        shell: buildah unshare nu {0}
        run: |-
          overlay use ${{ github.workspace }}/images/core/deb.nu as build
          build {
            from: 'debian:stable-slim'
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: deb
          }

      - name: build py
        shell: buildah unshare nu {0}
        run: |-
          overlay use ${{ github.workspace }}/images/core/py.nu as build
          build {
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: py
          }

      - name: Build ferron
        shell: buildah unshare nu {0}
        run: |
          overlay use ${{ github.workspace }}/images/service/ferron.nu as build
          build {
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: ferron
          }

      - name: build base
        if: ${{ !contains(github.event.head_commit.message, '+skip-core') }}
        shell: buildah unshare nu {0}
        run: |
          overlay use ${{ github.workspace }}/images/core/base.nu as build
          build {
            from: archlinux
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: latest
          }

      - name: build rust
        if: ${{ !contains(github.event.head_commit.message, '+skip-core') }}
        shell: buildah unshare nu {0}
        run: |
          overlay use ${{ github.workspace }}/images/core/rust.nu as build
          build {
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: rust
          }

      - name: build haskell
        if: ${{ !contains(github.event.head_commit.message, '+skip-core') }}
        shell: buildah unshare nu {0}
        run: |
          overlay use ${{ github.workspace }}/images/core/haskell.nu as build
          build {
            author: ${{ env.USERNAME }}
            password: ${{ secrets.GHCR_TOKEN }}
            image: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
            tag: haskell
          }
